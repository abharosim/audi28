# 复制为 config.toml 后再改。不要把密钥写进这个文件。
# webhook 和 DeepSeek 的密钥放项目根目录的 .env（已 gitignore）：
#   AUDI28_GROKBOT_WEBHOOK_URL=https://...
#   AUDI28_GROKBOT_WEBHOOK_KEY=...
#   DEEPSEEK_API_KEY=sk-...
#   # 可选：DEEPSEEK_BASE_URL=https://api.deepseek.com
# 密钥可以稍后才放。没有 DEEPSEEK_API_KEY 时进程不崩溃；
# `audi28 doctor` 会说明写进 ~/Code/audi28/.env，或导出到环境变量。

[web]
host = "127.0.0.1"
port = 8728

[events]
# 事件写在 data/events/YYYY-MM-DD.jsonl。这里暂时没有可调项，section 先留着。

# Audi 不能访问本机 HTTP。任务和决定写成 data/inbox/audi/*.json。
# Ruoran 已批准：Audi 可以把 JSON 写入 ~/Code/audi28/data/inbox/audi/（目录不存在可以建）。
# 其它 Mac 路径仍要单独批准。
[inbox]
poll_s = 0.2
parse_retries = 3
max_bytes = 1048576          # 超过则隔离，不跟随 symlink

# 把结果和提问推给 Audi 的 webhook。URL 和 key 只来自环境变量。
[grokbot]
header_name = "Authorization"
header_value = "Bearer {key}"
timeout_s = 10               # POST 超时。网络错误或超时在同一次 flush 里按短退避再试一次。
# 这是 webhook 的 HTTP 超时，不是审批超时。审批没有超时，见 [approval]。

[route]
# Phase 1 只用规则。以后 llm = true 时，规则无法判断的再交给模型，失败则回退到规则。
llm = false
default = "deepseek"         # 已经进入 inbox 的消息；self = 请 Audi 自己回答
# 正文包含其中一条，才开新 session。否则继续最近一个仍开放的 session。
# 判断写入 route 事件，必须有 reason。规则优先，以后可以换成同一个接口的 LLM。
new_task_phrases = ["新任务", "开一个新的", "new task"]

[sessions]
idle_timeout_s = 86400       # 超过此时长无新消息则标为 idle，不自动关闭，也不因此开新 session

[deepseek]
enabled = true
profile = "sdk"
# 必须显式给出。SDK 不会使用 ~/.dsh。相对路径相对于项目根目录。
dsh_home = "data/dsh-home"
# 默认工作区。`~` 在加载时展开成绝对路径。相对路径会报错，不会悄悄改用别的 $HOME 目录。
workspace = "~/Code/deepseek-workspace"
provider = "deepseek-official"
model = "deepseek-v4-flash"
permission_mode = "workspace-write"
approval_requests = true
# 可选：reasoning_effort = "max"
# 可选：max_tokens = 49152
initialize_timeout_seconds = 30

[approval]
# 不自动拒绝。pending 的审批和提问一直等到用户回答。
# 重启后仍在，会再次提醒，仪表盘上看得到。
# 不要加 timeout_s 或 timeout_action。
# 不对写文件、shell、装包、git、工作区以外路径做自动批准。

# 以后：Claude Code 的 PermissionRequest HTTP hook 会 POST 到本机。
[hooks]
enabled = false
token_env = "AUDI28_HOOK_TOKEN"
