[project]
name = "audi28"
version = "0.1.0"
description = "Local agent session layer and approval hub."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.2.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
audi28 = "audi28.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audi28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
